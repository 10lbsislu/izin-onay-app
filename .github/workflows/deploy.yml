name: Deploy — İzin Onay Sistemi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  deploy-frontend:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_REDIRECT_URI: https://wonderful-field-04c5e0703.7.azurestaticapps.net
          VITE_API_BASE_URL: https://izin-onay-api-gghsc5fgf8e8dsh3.westeurope-01.azurewebsites.net/api
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: dist
          skip_app_build: true

  deploy-api:
    name: API Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd api && npm ci
      - uses: Azure/functions-action@v1
        with:
          app-name: izin-onay-api
          package: ./api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
