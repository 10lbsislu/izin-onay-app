name: Deploy — İzin Onay Sistemi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  deploy-api:
    name: API Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd api && npm ci
      - uses: Azure/functions-action@v1
        with:
          app-name: izin-onay-api
          package: ./api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
